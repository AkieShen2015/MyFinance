name: personal-finance-analytics

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-change-this-secret}
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD:-local-development-only}@database:5432/finance
      FRONTEND_ORIGIN: http://localhost:5174
      SESSION_COOKIE_SECURE: "false"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_CACHE_DIR: /tmp/vite-cache
      VITE_API_TARGET: http://backend:8000
      VITE_HMR_CLIENT_PORT: "5174"
    volumes:
      - ./frontend:/app
      - frontend-node-modules-bookworm:/app/node_modules
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  frontend-node-modules-bookworm:
