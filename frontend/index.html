<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Private personal finance analytics" />
    <title>Personal Finance Analytics</title>
    <style>
      html { color: #172033; background: #f5f7fb; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-width: 320px; min-height: 100vh; }
      .static-shell { box-sizing: border-box; display: flex; min-height: 100vh; align-items: center; max-width: 1024px; margin: 0 auto; padding: 4rem 1.5rem; }
      .static-card { box-sizing: border-box; width: 100%; padding: 2.5rem; border: 1px solid #e2e8f0; border-radius: 1.5rem; background: #fff; box-shadow: 0 1px 3px rgb(15 23 42 / 0.08); }
      .static-eyebrow { margin: 0; color: #047857; font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      .static-title { margin: .75rem 0 0; color: #020617; font-size: clamp(2rem, 6vw, 2.5rem); line-height: 1.1; }
      .static-copy { max-width: 42rem; margin: 1rem 0 0; color: #475569; font-size: 1.125rem; line-height: 1.75; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="static-shell">
        <section class="static-card">
          <p class="static-eyebrow">Loading finance data</p>
          <h1 class="static-title">Personal Finance Analytics</h1>
          <p class="static-copy">
            Preparing your mock accounts and recent transactions…
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
